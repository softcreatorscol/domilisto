<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domilisto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#FF6600;--or2:#E85500;--ink:#111;--bg2:#FFF8F2;--tx2:#111;--s3:var(--or);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg2:#1b1612;--tx2:#fff}}
:root[data-theme=dark]{--bg2:#1b1612;--tx2:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg2);color:var(--tx2)}
.hero{background:linear-gradient(170deg,#FF7A1A,var(--or) 55%,var(--or2));color:#fff;text-align:center;padding:18px 20px 140px;position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.top{display:flex;justify-content:flex-end}
.login{background:#fff;color:#111;border-radius:999px;padding:10px 22px;font-weight:800;font-size:15px;text-decoration:none}
.loc{display:block;margin:16px auto 0;background:#fff;color:#111;border:0;border-radius:999px;padding:12px 22px;font:700 15px Poppins,sans-serif;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.hero>img.deco{position:absolute;bottom:10px;z-index:0;width:min(30vw,150px);max-width:none}
.chips{left:-10px}.taco{right:-10px}
.hero img.logo{width:170px;max-width:55%;margin-top:6px}
h1{font-weight:800;font-size:clamp(30px,9vw,52px);line-height:1.05;margin:26px auto 10px;max-width:560px;text-transform:uppercase}
.sub{margin:0 auto 28px;font-weight:500;font-size:15px}
.city{position:relative;max-width:480px;margin:0 auto}
.bar{display:flex;align-items:center;width:100%;background:#fff;border:0;border-radius:999px;padding:8px 8px 8px 22px;font:600 16px Poppins,sans-serif;color:#111;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18);text-align:left}
.bar span{flex:1}
.dot{width:46px;height:46px;border-radius:50%;background:#111;display:grid;place-items:center;transition:transform .2s}
.dot svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5}
.open .dot{transform:rotate(180deg)}
.list{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border-radius:22px;box-shadow:0 12px 28px rgba(0,0,0,.25);padding:8px;z-index:5;text-align:left;max-height:260px;overflow:auto}
.open .list{display:block}
.list a{display:block;padding:13px 16px;border-radius:14px;color:#111;text-decoration:none;font-weight:600}
.list a:hover,.list a:focus{background:#FFE9D9;outline:0}
.s2{background:var(--bg2);border-radius:28px 28px 0 0;margin-top:-34px;position:relative;padding:26px 16px 36px;text-align:center}
.go{display:flex;justify-content:center;gap:10px;align-items:center;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#FF7A1A,var(--or2));color:#fff;border-radius:999px;padding:15px 20px;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 8px 18px rgba(255,102,0,.35)}
h2{font-size:clamp(22px,6vw,32px);font-weight:800;margin:24px 0 18px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto;border-radius:18px;overflow:hidden}
.trio img{display:block;width:100%;aspect-ratio:5/8;object-fit:cover}
.lbl{display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;margin:10px auto 0;font-weight:800;font-size:clamp(12px,3.4vw,16px)}
.s3{background:var(--s3);padding:40px 16px 56px;text-align:center;color:#111}
.s3 h2{margin-top:0}
.s3 p{margin:0 auto 24px;max-width:420px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px;margin:0 auto}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr);max-width:820px}}
.tile{background:#fff;color:#111;border-radius:22px;padding:20px 10px 16px;font-weight:700;font-size:15px}
.tile img{width:64px;height:64px;display:block;margin:0 auto 10px}
</style></head><body>
